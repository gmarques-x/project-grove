# AeroSpace, the tiling window manager at the core of Project Grove's desktop.
# Spec: grove-dotfiles/docs/specs/2026-11-10-aerospace-design.md. Built on
# AeroSpace's default config (0.21); grove-keys moves these shortcuts to the
# Hyper key later.

config-version = 2

start-at-login = true
# JankyBorders in the current scheme's colours (rendered by grove-themes).
after-startup-command = ['exec-and-forget /bin/sh ~/.config/borders/bordersrc']

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false
key-mapping.preset = 'qwerty'

# No persistent-workspaces: a workspace exists only while it has a window (or
# is focused), so the bar can show just the ones in use.

# The top gap grows when SketchyBar arrives.
gaps.inner.horizontal = 8
gaps.inner.vertical = 8
gaps.outer.left = 8
gaps.outer.bottom = 8
gaps.outer.top = 8
gaps.outer.right = 8

[mode.main.binding]
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

alt-shift-semicolon = 'mode service'
# Added with the Grove menu: the searchable cheat sheet.
cmd-ctrl-alt-shift-k = 'exec-and-forget open grovekeys://cheatsheet'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset the layout
f = ['layout floating tiling', 'mode main'] # float or tile the window
backspace = ['close-all-windows-but-current', 'mode main']
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# Floating apps, also for windows already open when AeroSpace starts.
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.projectgrove.themes'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

# Pinned apps: new windows go to their workspace; windows already open when
# AeroSpace starts stay where they are. A rule for an app that isn't installed
# does nothing.

[[on-window-detected]] # Ghostty
if.app-id = 'com.mitchellh.ghostty'
if.during-aerospace-startup = false
run = 'move-node-to-workspace 1'

[[on-window-detected]] # Claude
if.app-id = 'com.anthropic.claudefordesktop'
if.during-aerospace-startup = false
run = 'move-node-to-workspace 2'

