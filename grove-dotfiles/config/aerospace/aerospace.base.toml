# AeroSpace, the tiling window manager at the core of Project Grove's desktop.
# Spec: grove-dotfiles/docs/specs/2026-11-10-aerospace-design.md. Built on
# AeroSpace's default config (0.21). This is the base: settings and window
# rules only. Shortcuts live in grove-keys/keys.toml; Grove Keys renders both
# into aerospace.toml, which is generated and untracked.

config-version = 2

start-at-login = true
# JankyBorders in the current scheme's colours (rendered by grove-themes).
after-startup-command = ['exec-and-forget /bin/sh ~/.config/borders/bordersrc']
# The Grove bar (SketchyBar) redraws its workspaces at once on every change.
exec-on-workspace-change = ['/bin/bash', '-c', '/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change FOCUSED=$AEROSPACE_FOCUSED_WORKSPACE']
# Moving a window to another workspace, or a pinned app opening there, changes
# focus but not the workspace: refresh the bar then too.
on-focus-changed = ['exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change']

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false
key-mapping.preset = 'qwerty'

# No persistent-workspaces: a workspace exists only while it has a window (or
# is focused), so the bar can show just the ones in use.

# The top gap clears the Grove bar: its 48 pt strip + 8.
gaps.inner.horizontal = 8
gaps.inner.vertical = 8
gaps.outer.left = 8
gaps.outer.bottom = 8
# Windows start where the Grove bar's 48 pt strip ends, 8 pt below its
# floating bar (the same as the gaps between windows): 48 where the menu bar
# reserves nothing; the built-in screen keeps 37.5 pt for the notch even when
# the menu bar hides, so it needs only 11 more.
gaps.outer.top = [{ monitor."built-in" = 11 }, 48]
gaps.outer.right = 8

# Floating apps, also for windows already open when AeroSpace starts.
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.projectgrove.themes'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.projectgrove.keys'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

# Pinned apps: new windows go to their workspace; windows already open when
# AeroSpace starts stay where they are. A rule for an app that isn't installed
# does nothing.

[[on-window-detected]] # Ghostty
if.app-id = 'com.mitchellh.ghostty'
if.during-aerospace-startup = false
run = 'move-node-to-workspace 1'

