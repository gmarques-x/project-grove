# One-line prompt: a bar of blocks (user, folder, git, time) joined by arrows,
# with rounded ends, then ❯. Nerd Font glyphs are drawn by Ghostty; Terminal.app
# uses starship-plain.toml. Colors: theme/everforest-dark-medium.
add_newline = true
format = """[](fg:#83C092)$username$directory$git_branch$git_status[](fg:#A7C080 bg:#DBBC7F)[](fg:#DBBC7F bg:#E69875)$time[](fg:#E69875) $character"""

[username]
show_always = true
style_user = "bg:#83C092 fg:#2D353B"
style_root = "bg:#83C092 fg:#2D353B"
format = "[  $user ]($style)"

[directory]
style = "bg:#A7C080 fg:#2D353B"
read_only_style = "bg:#A7C080 fg:#2D353B"
read_only = " 󰌾"
format = "[](fg:#83C092 bg:#A7C080)[ $path]($style)[$read_only]($read_only_style)[ ]($style)"

[git_branch]
style = "bg:#DBBC7F fg:#2D353B"
symbol = " "
format = "[](fg:#A7C080 bg:#DBBC7F)[ $symbol$branch ]($style)"

[git_status]
style = "bg:#DBBC7F fg:#2D353B"
untracked = "?"
modified = "!"
staged = "+"
format = "([$all_status$ahead_behind ]($style))"

[time]
disabled = false
style = "bg:#E69875 fg:#2D353B"
time_format = "%H:%M"
format = "[  $time ]($style)"

[character]
success_symbol = "[❯](fg:#D3C6AA)"
error_symbol = "[❯](fg:#E67E80)"
