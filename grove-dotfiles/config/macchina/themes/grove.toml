# Everforest Dark Medium, from theme/everforest-dark-medium.
# A light ASCII sky on the left; the stats in a titled box with an icon per label
# (Nerd Font, drawn by Ghostty) and the terminal's colors as dots underneath.
# Labels green, separators grey1, values in the terminal's fg. macchina 6.4
# colors a bar's filled part with the label color; it has no bar color key.
spacing = 2
padding = 0
hide_ascii = false
separator = "\uf1b2"
key_color = "#A7C080"
separator_color = "#859289"

[palette]
type = "Dark"
glyph = "● "
visible = true

[bar]
glyph = "▮"
symbol_open = "["
symbol_close = "]"
hide_delimiters = true
visible = true

[box]
title = " Grove "
border = "plain"
visible = true

[box.inner_margin]
x = 2
y = 1

[custom_ascii]
# A light night sky with a small pine: plain text, colored aqua here.
color = "#83C092"
path = "~/.config/macchina/grove.ascii"

[keys]
host = "󰒋 Host"
machine = "󰌢 Machine"
kernel = " Kernel"
os = " OS"
de = " Desktop"
wm = " WM"
packages = " Packages"
terminal = " Terminal"
shell = " Shell"
local_ip = " Local IP"
backlight = " Brightness"
resolution = "󰍹 Resolution"
uptime = " Uptime"
cpu = " CPU"
cpu_load = " CPU Load"
memory = "󰍛 Memory"
battery = " Battery"
