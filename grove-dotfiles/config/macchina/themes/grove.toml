# Everforest Dark Medium, from theme/everforest-dark-medium.
# Labels green, separators grey1, values in the terminal's fg. macchina 6.4
# colors a bar's filled part with the label color; it has no bar color key.
spacing = 2
padding = 0
hide_ascii = false
separator = "│"
key_color = "#A7C080"
separator_color = "#859289"

[palette]
visible = false

[bar]
glyph = "■"
symbol_open = "["
symbol_close = "]"
hide_delimiters = true
visible = true

[box]
border = "plain"
visible = false

[custom_ascii]
color = "#A7C080"
path = "~/.config/macchina/grove.ascii"
